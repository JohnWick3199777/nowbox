[project]
name = "nowbox"
version = "0.1.0"
description = "Sandboxing infrastructure extracted from now."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
extra-paths = ["src"]
python = ".venv"
